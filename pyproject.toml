[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "habitude"
version = "0.1.0.dev0"
description = "A JIT compiler for computer-use agents: run a task once with an AI agent, then replay it as verified, self-repairing code."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "vbvansh" }]
keywords = ["ai-agents", "browser-automation", "browser-use", "playwright", "rpa", "llm", "computer-use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
# Version ranges, not exact pins: other developers must be able to install
# Habitude next to their own libraries. Exact pins live in requirements.txt.
dependencies = [
    "browser-use>=0.13,<0.14",
    "playwright>=1.50",
    "pydantic>=2.10",
    "rapidfuzz>=3.10",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]
bench = ["jmespath>=1.0"]

[project.urls]
Homepage = "https://github.com/vbvansh/Habitude"
Issues = "https://github.com/vbvansh/Habitude/issues"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
